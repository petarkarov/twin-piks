<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f0c;--fg:#f2f4ee;--mut:#9aa092;--line:rgba(255,255,255,.1);--card:#161912;--acc:#a3c97a;--g:#8fae6b;--gr:#9d9ea3;--glow:rgba(143,174,107,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f7f1;--fg:#121510;--mut:#5f665a;--line:rgba(0,0,0,.1);--card:#e9eee1;--acc:#5f8a35;--glow:rgba(143,174,107,.35)}}
:root[data-theme="light"]{--bg:#f5f7f1;--fg:#121510;--mut:#5f665a;--line:rgba(0,0,0,.1);--card:#e9eee1;--acc:#5f8a35;--glow:rgba(143,174,107,.35)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--fg);font:400 16px/1.65 Manrope,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-weight:800;letter-spacing:-.03em;line-height:1.02}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.nav{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);z-index:30;width:min(920px,calc(100% - 28px));display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 18px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--bg) 62%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.logo svg{height:26px;width:auto}
.nav nav{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.nav nav a{padding:8px 14px;border-radius:999px;color:var(--mut);transition:.2s}
.nav nav a:hover{color:var(--fg);background:var(--line)}
.pill{background:var(--g)!important;color:#0d0f0c!important;font-weight:700}
.lang{border:1px solid var(--line);background:none;color:var(--fg);padding:7px 12px;border-radius:999px;font:700 12px Manrope;cursor:pointer}
@media(max-width:700px){.nav nav a:not(.pill){display:none}}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:140px 0 56px;overflow:hidden}
.hero::before{content:"";position:absolute;width:70vmax;height:70vmax;right:-25vmax;top:-30vmax;background:radial-gradient(circle,var(--glow),transparent 62%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse at 70% 20%,#000,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 20%,#000,transparent 70%);opacity:.6;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.tag{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:500;color:var(--mut);margin-bottom:28px}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g)}
.hero h1{font-size:clamp(46px,9.5vw,142px);max-width:13ch}
.hero h1 em{font-style:normal;color:var(--acc)}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-top:44px}
.hero p{max-width:440px;color:var(--mut);font-size:18px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:16px 28px;border-radius:999px;font-weight:700;font-size:14px;transition:.25s}
.btn:hover{background:var(--g);color:#0d0f0c;transform:translateY(-2px)}
.btn.o{background:none;color:var(--fg);border:1px solid var(--line)}
.marq{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:20px 0}
.marq div{display:inline-block;animation:m 30s linear infinite;font-size:clamp(22px,3vw,34px);font-weight:800;letter-spacing:-.02em;color:var(--mut)}
.marq span{margin:0 28px}.marq b{color:var(--g);font-weight:800}
@keyframes m{to{transform:translateX(-50%)}}
section{padding:120px 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:18px}
h2{font-size:clamp(36px,6vw,76px);margin-bottom:28px;max-width:16ch}
.intro{display:grid;grid-template-columns:1.2fr 1fr;gap:64px;align-items:end}
.intro p{color:var(--mut);font-size:18px}
@media(max-width:800px){.intro{grid-template-columns:1fr;gap:12px}section{padding:84px 0}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 36px}
.filters button{background:none;border:1px solid var(--line);color:var(--mut);padding:9px 20px;border-radius:999px;font:500 13px Manrope;cursor:pointer;transition:.2s}
.filters button:hover{color:var(--fg)}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.tile{grid-column:span 4;position:relative;display:block;border-radius:24px;overflow:hidden;aspect-ratio:4/5;background:linear-gradient(145deg,var(--c1),var(--c2))}
.tile:nth-child(5n+1){grid-column:span 7;aspect-ratio:auto;min-height:420px}
.tile:nth-child(5n+2){grid-column:span 5}
@media(max-width:900px){.tile,.tile:nth-child(5n+1),.tile:nth-child(5n+2){grid-column:span 6;aspect-ratio:4/5;min-height:0}}
@media(max-width:560px){.tile,.tile:nth-child(5n+1),.tile:nth-child(5n+2){grid-column:span 12}}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.22),transparent 45%);transition:.5s}
.tile:hover::before{transform:scale(1.3)}
.tile .ph{position:absolute;top:20px;left:22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.tile .cap{position:absolute;inset:auto 0 0 0;padding:60px 24px 22px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tile h3{font-size:26px;letter-spacing:-.02em}
.tile small{font-size:12px;opacity:.75;letter-spacing:.06em}
.tile .ar{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;transform:translateY(8px);opacity:0;transition:.3s}
.tile:hover .ar{transform:none;opacity:1}
.tile.hide{display:none}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-top:20px}
.bento div{grid-column:span 2;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:36px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;transition:.3s}
.bento div:hover{border-color:var(--g);transform:translateY(-4px)}
.bento div:first-child{grid-column:span 3;background:linear-gradient(150deg,var(--g),#5d7a3f);color:#0d0f0c;border:none}
.bento div:first-child p{color:rgba(13,15,12,.75)}
.bento div:nth-child(2){grid-column:span 3}
@media(max-width:800px){.bento div,.bento div:first-child,.bento div:nth-child(2){grid-column:span 6;min-height:0;gap:40px}}
.bento .n{font-size:13px;font-weight:700;letter-spacing:.15em;opacity:.7}
.bento h3{font-size:32px;margin-bottom:10px}
.bento p{color:var(--mut);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:30px;border-top:1px solid var(--line)}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}
.steps div{padding:30px 26px 30px 0;border-bottom:1px solid var(--line)}
.steps b{display:block;font-size:56px;font-weight:800;letter-spacing:-.04em;color:var(--g);line-height:1}
.steps h3{font-size:24px;margin:18px 0 8px}
.steps p{color:var(--mut);font-size:15px}
.cta{margin:0 24px 24px;border-radius:40px;background:linear-gradient(150deg,var(--g),#5d7a3f);color:#0d0f0c;padding:100px 24px;text-align:center;position:relative;overflow:hidden}
.cta h2{margin:0 auto 20px;max-width:12ch}
.cta p{max-width:520px;margin:0 auto 34px;color:rgba(13,15,12,.75);font-size:18px}
.cta .btn{background:#0d0f0c;color:#f2f4ee}.cta .btn:hover{background:#fff;color:#0d0f0c}
.cta .btn.o{background:none;color:#0d0f0c;border-color:rgba(13,15,12,.3)}
.cta .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.clist{display:flex;gap:10px 28px;justify-content:center;flex-wrap:wrap;margin-top:40px;font-size:14px;font-weight:700}
.clist a:hover{text-decoration:underline}
footer{padding:30px 0 40px;font-size:13px;color:var(--mut)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.marq div{animation:none}}
.tile{background-size:cover;background-position:center}.tile::before{display:none}.tile .img{display:none}.tile{transition:transform .5s}.tile:hover{transform:scale(1.015)}.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.45;-webkit-mask-image:linear-gradient(to bottom,#000 15%,transparent 92%);mask-image:linear-gradient(to bottom,#000 15%,transparent 92%)}
</style>
</head>
