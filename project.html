<div class="lb" id="lb" role="dialog" aria-modal="true" aria-hidden="true">
<img id="lbimg" alt="">
<button type="button" class="x" id="lbx" data-ka="close">✕</button>
<button type="button" class="pv" id="lbp" aria-label="‹">‹</button>
<button type="button" class="nx" id="lbn" aria-label="›">›</button>
<div class="ct" id="lbc"></div>
</div>

<script src="assets/projects.js?v=2"></script>
<script src="assets/site.js?v=2"></script>
<script>
(function(){
  var slug=new URLSearchParams(location.search).get("p"),idx=-1;
  PROJECTS.forEach(function(p,i){if(p.slug===slug)idx=i});
  if(idx<0){location.replace("projects.html");return}
  var p=PROJECTS[idx],n=PROJECTS.length,prev=PROJECTS[(idx-1+n)%n],next=PROJECTS[(idx+1)%n];
  var lb=document.getElementById("lb"),img=document.getElementById("lbimg"),cnt=document.getElementById("lbc"),cur=0,last=null;

  onRender(function(d){
    var brand=LANG==="mk"?"Твин Пикс Ентериери":"Twin Piks Interiors";
    document.title=p.name[LANG]+" | "+brand;
    var md=document.querySelector('meta[name="description"]');if(md)md.content=p.desc[LANG];
    document.getElementById("pc").textContent=catName(d,p.cat)+" · "+photoCount(d,p.photos.length);
    document.getElementById("pt").textContent=p.name[LANG];
    document.getElementById("pd").textContent=p.desc[LANG];
    document.getElementById("album").innerHTML=p.photos.map(function(src,k){
      return '<button type="button" data-i="'+k+'"><img src="'+src+'" loading="lazy" alt="'+esc(p.name[LANG]+" — "+(k+1))+'"></button>'}).join("");
    document.querySelectorAll("#album button").forEach(function(b){b.onclick=function(){open(+b.dataset.i)}});
    document.getElementById("pnav").innerHTML=
      '<a href="project.html?p='+prev.slug+'"><small>← '+esc(d.prev)+'</small>'+esc(prev.name[LANG])+'</a>'+
      '<a href="project.html?p='+next.slug+'"><small>'+esc(d.next)+' →</small>'+esc(next.name[LANG])+'</a>';
    document.getElementById("lbx").setAttribute("aria-label",d.close);
    if(lb.classList.contains("open"))show(cur);
  });

  function show(k){
    var len=p.photos.length;
    cur=(k+len)%len;
    if(img.getAttribute("src")!==p.photos[cur]){
      img.classList.add("ld");
      img.onload=img.onerror=function(){img.classList.remove("ld")};
      img.src=p.photos[cur];
      [cur+1,cur-1].forEach(function(j){new Image().src=p.photos[(j+len)%len]});
    }
    img.alt=p.name[LANG]+" — "+(cur+1);
    cnt.textContent=(cur+1)+" / "+p.photos.length;
    var many=p.photos.length>1;
    document.getElementById("lbp").style.display=many?"":"none";
    document.getElementById("lbn").style.display=many?"":"none";
  }
  function open(k){last=document.activeElement;show(k);lb.classList.add("open");lb.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";document.getElementById("lbx").focus()}
  function close(){lb.classList.remove("open");lb.setAttribute("aria-hidden","true");document.body.style.overflow="";if(last)last.focus()}
  document.getElementById("lbx").onclick=close;
  document.getElementById("lbp").onclick=function(){show(cur-1)};
  document.getElementById("lbn").onclick=function(){show(cur+1)};
  lb.addEventListener("click",function(e){if(e.target===lb)close()});
  document.addEventListener("keydown",function(e){
    if(!lb.classList.contains("open"))return;
    if(e.key==="Escape")close();else if(e.key==="ArrowLeft")show(cur-1);else if(e.key==="ArrowRight")show(cur+1);
  });
  var sx=null;
  lb.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
  lb.addEventListener("touchend",function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>45)show(cur+(dx<0?1:-1))});
})();
</script>
